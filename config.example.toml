[server]
http_listen = "127.0.0.1:5380"
dns_listen = ["127.0.0.1:8053"]
shutdown_timeout = "15s"

[database]
driver = "sqlite"
dsn = "data/sable.db"

[resolver]
# "forward" uses the upstreams below. "recursive" resolves directly from the
# DNS root while still honoring conditional routes and forwarder zones.
mode = "forward"
forwarders = ["1.1.1.1:53", "9.9.9.9:53"]
# root_hints = ["198.41.0.4:53", "170.247.170.2:53"]
timeout = "2s"
cache_size = 65536
cache_minimum_ttl = 10
cache_maximum_ttl = 604800
cache_negative_ttl = 300
cache_failure_ttl = 10
save_cache = false
serve_stale = false
cache_stale_ttl = 259200
cache_stale_answer_ttl = 30
cache_stale_reset_ttl = 30
cache_stale_max_wait = "1800ms"
cache_prefetch_minimum_ttl = 2
cache_prefetch_trigger_ttl = 9
cache_prefetch_sample_interval = "5m"
cache_prefetch_hits_per_hour = 30
dnssec_validation = true
dnssec_trust_anchor_updates = true
# Empty trust anchors use Sable's bundled IANA root KSK set. Custom anchors
# accept an owner followed by DS or DNSKEY RDATA.
# dnssec_trust_anchors = [". DS 20326 8 2 E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D"]
# Negative trust anchors are explicit local exceptions for broken private zones.
# Forwarder and stub zones carry their own DNSSEC validation switch, so prefer
# that when only one forwarded zone is unsigned.
# dnssec_negative_trust_anchors = ["legacy.corp.example"]

# [[resolver.routes]]
# domain = "internal.example"
# forwarders = ["192.0.2.53:53"]

# [[resolver.hosts]]
# name = "router.home.arpa"
# addresses = ["192.168.1.1", "fd00::1"]
# ttl = 300

# Authoritative zones and records are managed through the Sable console or zone API.
# They are stored transactionally in the configured SQLite or PostgreSQL database.
# Zone files are used only for import and export.
#
# TSIG keys are managed from Settings > TSIG in the console. Only the name and
# algorithm live here; the shared secret is held in the encrypted vault next to
# the DNSSEC and ACME material, so this file and its backups never carry it.
# A secret written below is moved into the vault on the next start and removed
# from the file, which is how an upgrade from an older release carries over.
# [[tsig_keys]]
# name = "transfer-example"
# algorithm = "hmac-sha256"

[blocking]
enabled = true
domains = ["example.invalid"]
allowed_domains = []
update_interval = "24h"
response_type = "nxdomain"
response_ttl = 30
custom_addresses = []
bypass_clients = []
allow_txt_report = true

# [[blocking.lists]]
# name = "local"
# path = "lists/block.txt"
# format = "auto"

# Remote subscriptions are downloaded into Sable's data directory and updated
# automatically. The path is optional for remote lists.
# [[blocking.lists]]
# name = "OISD Big"
# url = "https://big.oisd.nl/"
# format = "auto"

[query_log]
enabled = true
buffer_size = 8192
batch_size = 256
flush_interval = "250ms"
retention = "168h"

[server_log]
enabled = true
buffer_size = 4096
batch_size = 128
flush_interval = "1s"
retention = "1440h"

[encrypted_dns]
dot_listen = []
doh_listen = []
doq_listen = []
certificate_mode = "manual"
certificate_file = ""
private_key_file = ""
minimum_tls_version = "1.3"

# For managed certificates, switch certificate_mode to "acme" and configure
# provider credentials in Settings → Protocols. Credentials are encrypted in
# the secret vault and are never written here.
[encrypted_dns.acme]
email = ""
domains = []
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
dns_provider = ""
dns_zone = ""
storage_dir = "data/tls/acme"
renew_before = "720h"

# UniFi host synchronization. Set this up from Apps in the console: the wizard
# discovers the controller's networks, maps each one to a zone, and previews the
# records before enabling. Controller credentials are encrypted in the secret
# vault and are never written here.
[unifi]
enabled = false
controller_url = "https://192.168.1.1"
site = "default"
interval = "2m"
# "reservations" publishes configured fixed IPs, "active" publishes currently
# connected clients. A reservation always wins when both describe one device.
sources = ["reservations", "active"]
# UniFi consoles ship a self-signed certificate. Pin its issuer here, or accept
# the risk with tls_insecure.
tls_ca_file = ""
tls_insecure = false

# One mapping per UniFi network. Records land in the mapped zone and are owned
# by the synchronizer, so hand-authored records in the same zone are never
# touched. Reverse zones are derived from the network's own subnet.
# [[unifi.networks]]
# id = "61f0c1a2b3c4d5e6f7a8b9c0"
# name = "IoT"
# zone = "iot.example.net"
# hostname_template = "{{host}}.{{zone}}"
# ttl = 300
# reverse = true
# enabled = true

[security]
enabled = true
secure_cookies = false
session_ttl = "12h"
api_token_ttl = "2160h"
secret_key_file = "data/sable.key"

# Console sign-in through an OpenID Connect provider. Set this up from
# Integrations -> Single Sign-On in the console rather than by hand: the wizard
# contacts the issuer before saving anything, and seals the client secret in the
# encrypted vault, which is why no secret appears here.
#
# Enabling this adds a button to the sign-in page and takes nobody's password
# away. Moving an account to single sign-on only is a per-account switch on the
# Administration page, and Sable keeps one administrator able to sign in with a
# password so a problem at the provider cannot lock everyone out.
[oidc]
enabled = false
# display_name = "Pocket ID"
# issuer = "https://id.example.com"
# client_id = "sable"
# redirect_url = "https://dns.example.com/auth/oidc/callback"
# scopes = ["openid", "profile", "email", "groups"]
# username_claim = "preferred_username"
# email_claim = "email"
# groups_claim = "groups"
# Ask the UserInfo endpoint for claims the ID token leaves out, which some
# providers require before group membership arrives at all.
# fetch_userinfo = false
# Create an account the first time somebody signs in successfully.
# provision = true
# Attach a first sign-in to an existing account with the same email, but only
# when the provider asserts the address is verified. After that the provider's
# subject identifies the person, because an email address can change hands.
# link_by_verified_email = true
# Reconcile roles from the provider's groups on every sign-in. Only the roles
# named below are touched; anything assigned by hand in the console survives.
# sync_roles = true
# default_roles = ["Auditor"]
# rp_initiated_logout = false
# discovery_interval = "1h"
# clock_skew = "1m"

# Each mapping grants one Sable role to everyone carrying one provider group.
# The group is matched exactly as the provider sends it in groups_claim.
# [[oidc.role_mappings]]
# group = "dns-admins"
# role = "Administrator"

# Node-local clustering identity. Membership and synchronized state are stored
# in data_dir and are never embedded in this TOML file.
[cluster]
data_dir = "data/cluster"
node_name = ""
advertise_url = ""

[updates]
# Include release candidates when looking for a newer Sable release. The
# About page writes your choice here, so a server tracking release candidates
# keeps finding them after a restart.
pre_release = false

[config]
watch = true
debounce = "250ms"
