name: Release smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore release build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # setup-go keys its cache on go.sum alone and never refreshes it, so
          # every cross-platform target compiled from scratch. Keying on the
          # commit lets the main-branch smoke run warm the release for that SHA.
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-release-${{ runner.os }}-

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Validate release configuration
        run: go tool mage releaseCheck

      - name: Test release binary and cluster
        run: go tool mage releaseSmoke

      - name: Test multi-architecture container snapshot
        if: github.event_name != 'pull_request'
        run: go tool mage dockerSmoke

      - name: Save release build cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
