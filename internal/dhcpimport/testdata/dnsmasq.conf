# /etc/dnsmasq.d/hosts.conf from a Pi-hole or OpenWrt router
domain=lan
dhcp-range=10.0.7.100,10.0.7.199,12h
dhcp-host=00:11:22:33:44:55,10.0.7.10,nas,infinite
dhcp-host=AA-BB-CC-DD-EE-01,printer.lan,10.0.7.11   # name before address
--dhcp-host=aa:bb:cc:dd:ee:02,set:iot,10.0.7.12,12h
dhcp-host=aa:bb:cc:dd:ee:03,id:*,10.0.7.13
dhcp-host=aa:bb:cc:dd:ee:04,ignore
dhcp-host=laptop,10.0.7.14
dhcp-host=aa:bb:cc:dd:ee:05,aa:bb:cc:dd:ee:06,10.0.7.15,dock
dhcp-host=aa:bb:cc:dd:ee:07,[::7],10.0.7.16
